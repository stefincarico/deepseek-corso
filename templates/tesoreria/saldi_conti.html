{% extends "base.html" %} {% block content %}
<div class="section">
  <h2>{{ titolo_pagina }}</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Nome Conto</th>
        <th>Tipo</th>
        <th>Saldo Attuale</th>
      </tr>
    </thead>
    <tbody>
      {% for conto in conti %}
      <tr>
        <td>{{ conto.nome }}</td>
        <td>{{ conto.get_tipo_conto_display }}</td>
        <td>€ {{ conto.saldo|floatformat:2 }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">Nessun conto attivo trovato.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
